<!DOCTYPE html>
<html lang="de" class="h-full bg-[var(--bg-app)] transition-colors duration-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELC B2 Trainer — Debate Studio & Strategie</title>
    
    <!-- Fonts & PWA Metadata -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Outfit:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="apple-touch-icon" href="./icon-512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">

    <!-- Tailwind CDN with Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>    
  
    <!-- Custom CSS Variables & Animations -->
    <link rel="stylesheet" href="css/app.css">

    <!-- Firebase SDKs (Gracefully bypassed if offline or unavailable) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Pragmatic Engine Script (Standard script, works locally and online) -->
    <script defer src="js/app.js"></script>
</head>
<body class="h-full flex flex-col lg:flex-row overflow-hidden bg-[var(--bg-app)] text-[var(--text-primary)] select-none">

    <!-- Drawer Overlay -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[85] hidden transition-opacity duration-300"></div>

    <!-- 1. SIDEBAR -->
    <aside id="sidebar" class="bg-[var(--bg-card)] lg:bg-[var(--bg-sidebar)] flex flex-col overflow-hidden border-t lg:border-t-0 lg:border-r border-[var(--border)] transition-all duration-300">
        <!-- Mobile Drag Handle -->
        <div id="sidebar-drag-handle" class="w-full flex flex-col items-center pt-3 pb-2 lg:hidden shrink-0 cursor-pointer bg-[var(--bg-card)] rounded-t-[28px]">
            <div class="w-14 h-1 bg-[var(--text-faint)] rounded-full opacity-40 mb-1.5"></div>
            <span class="text-[10px] font-extrabold text-[var(--text-muted)] uppercase tracking-widest">Schließen</span>
        </div>

        <!-- Desktop Header -->
        <div class="p-4 border-b border-[var(--border)] bg-[var(--bg-card)] items-center justify-between sidebar-header-flex shrink-0 hidden lg:flex">
            <h2 class="font-extrabold text-sm hide-on-collapse text-[var(--text-primary)]">Themenpool</h2>
            <button id="sidebar-toggle-btn" class="p-1.5 rounded-lg hover:bg-[var(--bg-app)] text-[var(--text-muted)] transition-colors cursor-pointer" title="Sidebar minimieren">
                <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <!-- Tab Toggle -->
        <div class="flex gap-2 p-3 bg-[var(--bg-app)] border-b border-[var(--border)] shrink-0 hide-on-collapse">
            <button id="sbar-tab-list" class="flex-1 py-2 text-xs font-black bg-[var(--bg-card)] text-[var(--accent)] rounded-lg shadow-sm border border-[var(--border)] transition-all">📚 Themen</button>
            <button id="sbar-tab-mini" class="flex-1 py-2 text-xs font-black text-[var(--text-muted)] hover:text-[var(--text-primary)] rounded-lg transition-all">🗂️ Mini-Ansicht</button>
        </div>

        <!-- Sidebar Topics List -->
        <div id="sidebar-themen-content" class="flex-1 flex flex-col overflow-hidden">
            <div class="p-3 border-b border-[var(--border)] bg-[var(--bg-app)] space-y-2.5 shrink-0 hide-on-collapse">
                <div class="flex items-center justify-between text-xs font-bold">
                    <span class="text-[10px] uppercase tracking-wider text-[var(--text-muted)]">Fortschritt</span>
                    <span id="progress-text" class="text-[var(--text-primary)] font-mono">0 / 0</span>
                </div>
                <div class="w-full bg-zinc-200 dark:bg-zinc-800 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-[var(--accent)] h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="grid grid-cols-3 gap-1 bg-[var(--bg-card)] p-1 rounded-lg border border-[var(--border)] text-[10px] font-bold">
                    <button id="filter-all-btn" class="py-1 text-center rounded bg-[var(--bg-app)] text-[var(--text-primary)] shadow-sm">Alle</button>
                    <button id="filter-learned-btn" class="py-1 text-center rounded text-[var(--text-muted)] hover:text-[var(--text-primary)]">Gelernt</button>
                    <button id="filter-offen-btn" class="py-1 text-center rounded text-[var(--text-muted)] hover:text-[var(--text-primary)]">Offen</button>
                </div>
                <div class="relative">
                    <input type="text" id="search-bar" placeholder="Themen filtern..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-[var(--bg-card)] border border-[var(--border)] text-[var(--text-primary)] rounded-lg focus:outline-none focus:ring-1 focus:ring-[var(--accent)] select-text" />
                    <svg class="w-3.5 h-3.5 text-[var(--text-muted)] absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
            <nav id="topic-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-[var(--bg-sidebar)] no-scrollbar"></nav>
        </div>

        <!-- Sidebar Mini-View -->
        <div id="sidebar-mini-content" class="flex-1 hidden flex-col overflow-hidden bg-[var(--bg-sidebar)] hide-on-collapse">
            <div class="p-3 border-b border-[var(--border)] bg-[var(--bg-card)] shrink-0">
                <div class="flex gap-1.5 p-1 bg-[var(--bg-app)] rounded-lg border border-[var(--border)] text-xs font-bold">
                    <button id="mini-toggle-vocab" class="flex-1 py-1 text-center rounded bg-[var(--bg-card)] text-[var(--accent)] shadow-sm">🧠 Vokabeln</button>
                    <button id="mini-toggle-rede" class="flex-1 py-1 text-center rounded text-[var(--text-muted)]">💬 Redemittel</button>
                </div>
            </div>
            <div id="right-panel-content" class="flex-1 overflow-y-auto p-3 space-y-2.5 no-scrollbar"></div>
        </div>
    </aside>

    <!-- 2. MAIN APP VIEWPORT -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="bg-[var(--bg-card)] border-b border-[var(--border)] px-4 lg:px-6 py-3.5 flex items-center justify-between gap-4 z-40 shadow-sm shrink-0 relative pt-4">
            <div class="absolute top-0 left-0 w-full h-1 flex">
                <div class="flex-1 bg-zinc-900"></div>
                <div class="flex-1 bg-red-600"></div>
                <div class="flex-1 bg-amber-400"></div>
            </div>

            <div class="flex items-center gap-3">
                <div class="w-9 h-9 flex-shrink-0 bg-[var(--accent)] rounded-xl flex items-center justify-center text-white font-black text-sm tracking-tighter shadow-md">B2</div>
                <div>
                    <h1 class="text-base font-extrabold text-[var(--text-primary)] tracking-tight">TELC B2 Trainer</h1>
                    <p class="text-[9px] font-bold text-[var(--text-muted)] uppercase tracking-wider hidden sm:block">Debate Studio & Strategie</p>
                </div>
            </div>

            <!-- Desktop Nav -->
            <div class="hidden lg:flex bg-[var(--bg-app)] p-1 rounded-xl border border-[var(--border)] gap-1 shadow-inner">
                <button id="nav-themen-desk" class="px-3.5 py-1.5 text-xs font-black rounded-lg bg-[var(--accent)] text-white shadow-md transition-all">📚 Studio</button>
                <button id="nav-raster-desk" class="px-3.5 py-1.5 text-xs font-black rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all">📦 Raster</button>
                <button id="nav-tools-desk" class="px-3.5 py-1.5 text-xs font-black rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all">🛠️ Redemittel</button>
                <button id="nav-grammar-desk" class="px-3.5 py-1.5 text-xs font-black rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all">📖 Grammatik</button>
                <button id="nav-settings-desk" class="px-3.5 py-1.5 text-xs font-black rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all">⚙️ Setup</button>
            </div>

            <div class="flex items-center gap-2">
                <button id="header-profile-btn" class="p-2 rounded-lg border border-[var(--border)] bg-[var(--bg-card)] text-[var(--text-primary)] hover:bg-[var(--bg-app)] transition-colors shadow-sm" title="Profil & Cloud-Konto">👤</button>
                <button id="header-reload-btn" class="p-2 rounded-lg border border-[var(--border)] bg-[var(--bg-card)] text-[var(--text-primary)] hover:bg-[var(--bg-app)] transition-colors shadow-sm" title="App aktualisieren">🔄</button>
            </div>
        </header>

        <!-- Main Dynamic Workspace -->
        <main id="main-scroll-container" class="flex-1 overflow-y-auto p-4 md:p-6 pb-28 lg:pb-8 space-y-6 bg-[var(--bg-app)] relative no-scrollbar">

            <!-- Desktop Studio Command Bar -->
            <div id="studio-command-bar" class="hidden sticky top-2 z-[80] w-max mx-auto bg-[var(--bg-card)]/95 backdrop-blur-xl border border-[var(--border)] rounded-2xl p-1.5 shadow-2xl transition-all">
                <div class="flex items-center gap-1">
                    <div id="studio-save-status" class="flex items-center px-2 py-1" title="Automatisch gespeichert">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 studio-pulse"></span>
                    </div>
                    <div class="h-4 w-px bg-[var(--border)] mx-0.5"></div>
                    <button id="cmd-select-all" class="toolbar-btn" title="Block markieren">⛶</button>
                    <button id="cmd-bold" class="toolbar-btn font-black" title="Fett">B</button>
                    <button id="cmd-underline" class="toolbar-btn font-bold" title="Unterstreichen"><u>U</u></button>
                    <button id="cmd-bullet" class="toolbar-btn" title="Aufzählungsliste">•≡</button>
                    <div class="h-4 w-px bg-[var(--border)] mx-0.5"></div>
                    <button class="hl-dot bg-yellow-400" data-color="yellow" title="Gelb markieren"></button>
                    <button class="hl-dot bg-blue-400" data-color="blue" title="Blau markieren"></button>
                    <button class="hl-dot bg-red-400" data-color="red" title="Rot markieren"></button>
                    <button class="hl-dot bg-green-400" data-color="green" title="Grün markieren"></button>
                    <div class="h-4 w-px bg-[var(--border)] mx-0.5"></div>
                    <button id="cmd-clear" class="toolbar-btn text-rose-500" title="Formatierung löschen">🧹</button>
                    <button id="cmd-add-vocab" class="toolbar-btn text-indigo-600" title="Als Vokabel speichern">🧠+</button>
                    <div class="h-4 w-px bg-[var(--border)] mx-0.5"></div>
                    <button id="cmd-undo" class="toolbar-btn" title="Rückgängig (Strg+Z)">↩</button>
                    <button id="cmd-redo" class="toolbar-btn" title="Wiederholen (Strg+Y)">↪</button>
                    <button id="cmd-done" class="w-7 h-7 flex items-center justify-center bg-emerald-600 text-white rounded-lg shadow font-bold text-xs" title="Fertig">✓</button>
                </div>
            </div>

            <!-- SECTION 1: WORKSPACE -->
            <div id="section-workspace" class="space-y-5 animate-fade-in">
                <div id="dashboard-controls" class="bg-[var(--bg-card)] border border-[var(--border)] p-4 rounded-2xl shadow-sm flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-3 w-full">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <div class="w-12 h-12 bg-gradient-to-br from-[var(--bg-app)] to-[var(--bg-sidebar)] border border-[var(--border)] rounded-xl flex items-center justify-center text-2xl shadow-inner shrink-0">
                                <span id="active-topic-emoji">📌</span>
                            </div>
                            <div class="flex flex-col min-w-0 flex-1">
                                <div class="flex items-center gap-2">
                                    <span id="active-topic-badge" class="px-2 py-0.5 text-[10px] font-mono font-bold bg-neutral-200 dark:bg-neutral-800 rounded uppercase">Thema --</span>
                                    <button id="learned-toggle" class="h-6 text-[10px] font-bold rounded-md px-2.5 transition-all border border-[var(--border)] bg-[var(--bg-card)] flex items-center gap-1"></button>
                                </div>
                                <h2 id="active-topic-title" class="text-base md:text-lg font-black text-[var(--text-primary)] truncate mt-0.5">Lade Thema...</h2>
                            </div>
                        </div>

                        <div class="hidden xl:flex items-center gap-2 shrink-0">
                            <button id="btn-save-manual" class="btn-action bg-[var(--accent)] text-white">Sichern</button>
                            <button id="btn-pdf-export" class="btn-action bg-slate-800 dark:bg-slate-200 text-white dark:text-black">PDF</button>
                            <button id="btn-reset-topic" class="btn-action bg-rose-50 dark:bg-rose-950/30 text-rose-600 border border-rose-200 dark:border-rose-900">Reset</button>
                        </div>
                    </div>

                    <!-- Subtabs -->
                    <div class="grid grid-cols-2 bg-[var(--bg-app)] p-1 rounded-xl border border-[var(--border)] w-full gap-1">
                        <button id="subtab-template" class="py-2 text-xs font-black rounded-lg bg-[var(--bg-card)] text-[var(--text-primary)] shadow-sm">📝 Template & Dialog</button>
                        <button id="subtab-wortschatz" class="py-2 text-xs font-black rounded-lg text-[var(--text-muted)] hover:text-[var(--text-primary)]">🧠 Vokabelkarten</button>
                    </div>
                </div>

                <div id="active-topic-container" class="space-y-4"></div>
            </div>

            <!-- SECTION 2: BENTO GRID / MINDMAP (Dynamic 55+ Topics) -->
            <section id="section-mindmap" class="hidden space-y-5 animate-fade-in">
                <div class="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h3 class="text-base font-black text-[var(--text-primary)]">📦 Themen-Raster</h3>
                        <p class="text-xs text-[var(--text-muted)]">Gesamtübersicht aller TELC B2 Diskussionsthemen.</p>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="text" id="grid-search" placeholder="Raster suchen..." class="text-xs px-3 py-1.5 bg-[var(--bg-app)] border border-[var(--border)] rounded-lg text-[var(--text-primary)] focus:outline-none flex-1 sm:w-48 select-text" />
                        <select id="grid-category-filter" class="text-xs px-2.5 py-1.5 bg-[var(--bg-app)] border border-[var(--border)] rounded-lg font-bold text-[var(--text-primary)]">
                            <option value="all">Alle Kategorien</option>
                        </select>
                    </div>
                </div>
                <div id="box-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5"></div>
            </section>

            <!-- SECTION 3: REDEMITTEL -->
            <section id="section-redemittel" class="hidden space-y-5 animate-fade-in"></section>

            <!-- SECTION 4: GRAMMATIK -->
            <section id="section-grammar" class="hidden space-y-5 animate-fade-in"></section>

            <!-- SECTION 5: SETUP & BACKUP -->
            <section id="section-settings" class="hidden space-y-5 animate-fade-in max-w-4xl mx-auto"></section>

        </main>
    </div>

    <!-- 3. FLOATING ACTION BUTTONS -->
    <div id="floating-action-buttons" class="fixed right-4 bottom-20 lg:bottom-6 flex flex-col gap-2.5 z-40 transition-all">
        <button id="fab-undo" class="hidden fab-btn" title="Rückgängig">↩</button>
        <button id="fab-redo" class="hidden fab-btn" title="Wiederholen">↪</button>
        <button id="fab-edit-toggle" class="w-12 h-12 bg-white dark:bg-zinc-800 text-[var(--accent)] rounded-full shadow-lg border border-[var(--border)] flex items-center justify-center active:scale-95 transition-all cursor-pointer" title="Bearbeitungsmodus">
            ✏️
        </button>
    </div>

    <!-- Mobile Toolbar -->
    <div id="formatting-toolbar" class="hidden fixed z-[9999] flex items-center gap-1.5 bg-[var(--bg-card)]/95 backdrop-blur-2xl border border-[var(--border)] px-2.5 py-1.5 rounded-2xl shadow-2xl overflow-x-auto no-scrollbar">
        <button class="mob-tool-btn" data-action="bold"><b>B</b></button>
        <button class="mob-tool-btn" data-action="underline"><u>U</u></button>
        <button class="mob-tool-btn" data-action="bullet">•≡</button>
        <div class="h-4 w-px bg-[var(--border)]"></div>
        <button class="hl-dot bg-yellow-400" data-color="yellow"></button>
        <button class="hl-dot bg-blue-400" data-color="blue"></button>
        <button class="hl-dot bg-red-400" data-color="red"></button>
        <button class="hl-dot bg-green-400" data-color="green"></button>
        <div class="h-4 w-px bg-[var(--border)]"></div>
        <button class="mob-tool-btn text-indigo-500" data-action="vocab">🧠+</button>
        <button class="mob-tool-btn text-emerald-600" data-action="close">✓</button>
    </div>

    <!-- 4. MOBILE BOTTOM NAVIGATION -->
    <nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 bg-[var(--bg-card)]/95 backdrop-blur-xl border-t border-[var(--border)] pb-safe pt-1.5 pb-2 px-3 flex justify-around items-end z-[70] shadow-lg">
        <button id="nav-themen-mob" class="mob-nav-btn text-[var(--accent)]">
            <span>📚</span><span class="text-[10px] font-bold">Themen</span>
        </button>
        <button id="nav-raster-mob" class="mob-nav-btn text-[var(--text-muted)]">
            <span>📦</span><span class="text-[10px] font-bold">Raster</span>
        </button>
        
        <!-- Center Floating Action Button (Opens Sidebar) -->
        <div class="relative -top-4 w-12 h-12 shrink-0">
            <button id="mob-center-drawer-btn" class="absolute inset-0 bg-gradient-to-tr from-sky-600 to-sky-400 text-white rounded-full shadow-md border-4 border-[var(--bg-app)] flex items-center justify-center active:scale-90 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <button id="nav-tools-mob" class="mob-nav-btn text-[var(--text-muted)]">
            <span>🛠️</span><span class="text-[10px] font-bold">Tools</span>
        </button>
        <button id="nav-settings-mob" class="mob-nav-btn text-[var(--text-muted)]">
            <span>⚙️</span><span class="text-[10px] font-bold">Setup</span>
        </button>
    </nav>

    <!-- Modals Container -->
    <div id="modal-container"></div>
</body>
</html>
